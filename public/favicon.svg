  <rect x="60" y="70" width="12" height="6" rx="2" fill="#0f172a" />
  <!-- Live Signal / Flow badge -->
  <path d="M 50 12 A 12 12 0 0 1 62 20" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <path d="M 50 6 A 18 18 0 0 1 68 18" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
</svg>
